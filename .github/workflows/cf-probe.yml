name: CF resource probe

# One-off: which account resources can this token create/read?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          API=https://api.cloudflare.com/client/v4
          hdr=(-s -H "Authorization: Bearer $CF_TOKEN")
          code() { curl "${hdr[@]}" -o /dev/null -w "%{http_code}" "$1"; }
          echo "d1/database        : $(code "$API/accounts/$CF_ACCOUNT/d1/database")"
          echo "r2/buckets         : $(code "$API/accounts/$CF_ACCOUNT/r2/buckets")"
          echo "kv/namespaces      : $(code "$API/accounts/$CF_ACCOUNT/storage/kv/namespaces")"
          echo "images/v1          : $(code "$API/accounts/$CF_ACCOUNT/images/v1")"
          echo "workers/scripts    : $(code "$API/accounts/$CF_ACCOUNT/workers/scripts")"
          echo "pages/projects     : $(code "$API/accounts/$CF_ACCOUNT/pages/projects")"
