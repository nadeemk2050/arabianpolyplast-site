name: KV cleanup

# One-off: delete the storage-test listing and its image from the market KV,
# using the KV bulk-delete API so nothing depends on wrangler's CLI syntax.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bulk delete
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          NS=bdd1cef571c5494c8fcd9851a48c456f
          curl -sS -X POST \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d '["listing:mkt-mwz8ixw8-o802","img:mkt-mwz8ixw8-o802-0"]' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/storage/kv/namespaces/$NS/bulk/delete"
          echo
