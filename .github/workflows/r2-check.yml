name: R2 enable check

# One-off: is R2 enabled on the account, and can we create the media bucket?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create bucket
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          API=https://api.cloudflare.com/client/v4
          echo -n "list buckets : "
          curl -s -H "Authorization: Bearer $CF_TOKEN" "$API/accounts/$CF_ACCOUNT/r2/buckets" | head -c 300; echo
          echo -n "create       : "
          curl -s -X POST -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"oman-scrap-market-media"}' "$API/accounts/$CF_ACCOUNT/r2/buckets" | head -c 400; echo
